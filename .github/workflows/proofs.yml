# Every push and pull request: build every proof, run the axiom gate and the statement lock.
# A release of KANON is blocked unless this passes (the app's CI checks this repo's status).
name: Proofs
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          # GitHub's release downloads sometimes fail for a while (504/503): try again before giving up.
          for i in 1 2 3 4 5; do
            curl -sSfL --retry 5 --retry-all-errors --retry-delay 15 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && break
            sleep $((i * 30))
          done
          test -x "$HOME/.elan/bin/elan"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the prebuilt maths library (Mathlib)
        run: ok=; for i in 1 2 3 4 5; do lake exe cache get && { ok=1; break; }; sleep $((i * 30)); done; [ -n "$ok" ]
      - name: Build every proof
        run: lake build
      - name: "#1 Axiom gate (no sorry, no native_decide, no custom axioms)"
        run: python3 scripts/proofs.py gate
      - name: "#2 Statement lock (statements match their reviewed versions)"
        run: python3 scripts/proofs.py lock
      - name: "#9 Reference vectors come from the models (regenerate and compare)"
        run: |
          lake env lean scripts/Vectors.lean > /tmp/reference.json
          diff vectors/reference.json /tmp/reference.json
      - name: "#20 Proof manifest"
        run: python3 scripts/proofs.py manifest | tee manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: proof-manifest
          path: manifest.json
